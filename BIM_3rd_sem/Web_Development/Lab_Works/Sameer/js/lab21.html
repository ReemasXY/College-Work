<!-- . Find the Factorial of a Number using JavaScript
  -->

<html>
  <head>
    <title>lab20</title>
  </head>

  <script>
    const a = parseInt(prompt("Enter a  number"));
    let fact = 1;
    for (let i = 2; i <= a; i++) {
      fact *= i;
    }
    document.write("The factorial of " + a + " is " + fact);
  </script>
</html>
