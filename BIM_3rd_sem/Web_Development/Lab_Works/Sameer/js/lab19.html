<!-- Find whether the given number is odd or even
  -->
<html>
  <head>
    <title>lab19</title>
  </head>

  <script>
    const a = parseInt(prompt("Enter a  number"));
    let oe = "";
    if (a % 2 == 0) {
      oe = "even";
    } else {
      oe = "odd";
    }
    document.write(a + " is " + oe);
    console.log(oe, a);
  </script>
</html>
