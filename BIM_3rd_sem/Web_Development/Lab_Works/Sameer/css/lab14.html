 <!-- consider a html page contains two divisions and one paragraph tags. The divisons have id div1 and div2 respectively. The color of text in both of divisions should be red and background color of the divisons should be green. The fonts style of in paragraph should be Arial and the size of font should be 14. Write necessary CSS for the given scenario. -->
 <html>
    <head>
        <title>lab 14</title>
    </head>
    <body>
        <div id="div1">The text in div1</div>
        <div id="div2">The text in div2</div>
        <p>This is paragraph tag</p>
    </body>
    <style>
        #div1,#div2{
            color: red;
            background-color: green;
        }
        p{
            font-family: Arial;
            font-size: 14px;
        }
    </style>
 </html>
