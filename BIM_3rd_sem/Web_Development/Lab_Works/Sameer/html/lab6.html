texts -->

<html>
  <head>
    <title>Formatting Text</title>
  </head>
  <body>
    <p>
      About Home town
      <br />
      <b>Kathmandu,</b> the <strong>capital</strong> of <i>Nepal</i>, is a

      <mark>Himalayas</mark>.
    </p>
  </body>
</html>
