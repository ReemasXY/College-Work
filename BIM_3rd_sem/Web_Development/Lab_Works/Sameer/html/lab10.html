<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Test</title>

  <body>
    <div id="dv1">
      <table>
        <tr>

          <td>Test</td>
          <td>200</td>

      </table>
      <p>
       
          The above table is about the;
        <ol type="a">
            <li>Use of rows and <i>columns</i></li>

        </ol>
      </p>
    </div>
    <style>
      table,
      th,
      td {
        border: 2px solid black;
        border-collapse: collapse;
      }
      
    </style>
